name: Release

# Consolidated release flow, following the calaos org convention (model:
# calaos/calaos-container's build-deb-push.yml).
#
# The version lives in GIT TAGS, nowhere else. `calaos/action-bump-version@2`
# takes the highest existing tag (dpkg version ordering over `git tag -l`)
# and bumps it:
#
#   * push to master          -> `prerelease`  3.0.1 -> 3.0.2-dev.0 -> 3.0.2-dev.1 …
#   * workflow_dispatch patch -> 3.0.2   minor -> 3.1.0   major -> 4.0.0
#
# so every merge to master automatically publishes a `-dev.N` prerelease and
# a real release is one manual dispatch. Tags are bare (no `v` prefix); the
# `-` in a prerelease tag is turned into `~` later, by pkgdebs, for Debian
# version ordering. `package.json` keeps the literal placeholder `0.0.0-git`
# and is never hand-bumped: `npm version --no-git-tag-version` injects the
# computed version into the workspace right before the build.
#
# Step order is load-bearing at the end: the GitHub Release (with its
# tarball asset) MUST exist before the repository_dispatch, because the deb
# build in calaos/pkgdebs downloads the asset by tag.
#
# `secrets.ACTION_DISPATCH` is an org PAT. The default GITHUB_TOKEN cannot
# be used here: tags/releases it creates do not re-trigger workflows, and it
# has no access to calaos/pkgdebs.
on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      vincrement:
        description: 'Package version increment (major.minor.patch)'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  ci:
    name: CI quality gate
    uses: ./.github/workflows/test.yml

  build-and-release:
    name: Build, publish release asset and dispatch deb build
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      # Reads every git tag (the action fetches tags and unshallows the
      # clone itself) and bumps the highest one. On a `push` event
      # `github.event.inputs` is null, so the expression falls back to
      # `prerelease`; on a dispatch it is the chosen major/minor/patch.
      - name: Calaos Action Bump Version
        id: calaos_version
        uses: calaos/action-bump-version@2
        with:
          version_fragment: ${{ github.event.inputs.vincrement || 'prerelease' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # vite@8 requires Node >=20.19 (package.json "engines" matches).
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # package.json ships the placeholder `0.0.0-git`; stamp the real
      # version in before building so anything that reads it at build time
      # sees the released version. Not committed — the tag is the truth.
      - name: Inject version into package.json
        env:
          VERSION: ${{ steps.calaos_version.outputs.version_bumped }}
        run: |
          npm version --no-git-tag-version "$VERSION"
          node -p "'package.json version is now ' + require('./package.json').version"

      - name: Build
        run: npm run build

      # Archive the CONTENTS of dist/, not the directory: consumers untar
      # straight into their web root (`tar xzf … -C /public`) and get
      # index.html at the top level, no --strip-components needed. The
      # --sort/--owner/--group/--numeric-owner flags make the tarball
      # reproducible.
      - name: Package dist/
        env:
          VERSION: ${{ steps.calaos_version.outputs.version_bumped }}
        run: |
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -czf "calaos-web-app-$VERSION.tar.gz" -C dist .
          tar tzf "calaos-web-app-$VERSION.tar.gz"

      - name: Create Tag
        uses: negz/create-tag@v1
        with:
          version: ${{ steps.calaos_version.outputs.version_bumped }}
          token: ${{ secrets.ACTION_DISPATCH }}

      # `prerelease` is true exactly when this run was not a manual
      # dispatch: on `push`, `github.event.inputs.vincrement` is empty.
      - name: Create a Release
        uses: meeDamian/github-release@2.0
        with:
          token: ${{ secrets.ACTION_DISPATCH }}
          tag: ${{ steps.calaos_version.outputs.version_bumped }}
          name: ${{ steps.calaos_version.outputs.version_bumped }}
          prerelease: ${{ github.event.inputs.vincrement == '' }}
          files: calaos-web-app-${{ steps.calaos_version.outputs.version_bumped }}.tar.gz
          gzip: false

      # Hands off to calaos/pkgdebs, which builds the calaos-web-app .deb
      # from the release asset above and pushes it to deb.calaos.fr. Must
      # stay AFTER the release step.
      - name: Repository Dispatch to pkgdebs
        uses: peter-evans/repository-dispatch@v1
        with:
          token: ${{ secrets.ACTION_DISPATCH }}
          repository: calaos/pkgdebs
          event-type: build_deb
          client-payload: '{"pkgname": "calaos-web-app", "version": "${{ steps.calaos_version.outputs.version_bumped }}", "image_src": "", "prerelease": ${{ github.event.inputs.vincrement == '''' }} }'
