name: Test

# Quality gates for the Vue 3 app (app/, e2e/, mock-server/). Runs
# standalone on every pull request, and is called as a reusable workflow
# by release.yml (`needs: ci`) on push to master, so a release is only
# built and published when all gates are green. There is deliberately NO
# `push` trigger here: release.yml already runs this suite for every
# master push, and keeping `push` would run it twice per commit.
#
# This workflow only tests the repo: the E2E step (`npm run test:e2e` ->
# playwright.config.ts's webServer) runs `vite build`/`vite preview` in
# the runner's own workspace. dist/ is gitignored build output;
# packaging/publishing is owned by release.yml, which builds and attaches
# the release asset consumers download.
on:
  pull_request:
  workflow_call:

jobs:
  test:
    name: Lint, typecheck, unit and e2e tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # vite@8 requires Node >=20.19 (package.json "engines" matches).
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Resolve installed Playwright version
        id: playwright-version
        run: |
          echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # On a cache hit the browser binaries are restored but the runner's OS
      # packages (apt libs) are not, since those live outside
      # ~/.cache/ms-playwright and every job runs on a fresh VM — so
      # `install-deps` (no download) still has to run every time, while the
      # (slow) browser download is skipped whenever the cache already has it.
      - name: Install Playwright browsers (with OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (browsers cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
